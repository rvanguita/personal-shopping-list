[project]
name = "shopping-list"
version = "0.1.0"
description = "Intelligent grocery purchase tracking with receipt OCR and a medallion data pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "google-genai>=2.17.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
]

[project.scripts]
shopping-list = "shopping_list:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
