# app/dash/pyproject.toml — only this app's dependencies.
[project]
name = "shopping-list-dash"
version = "0.1.0"
description = "Dash app: read-only analytics dashboard (English, dark theme)"
requires-python = ">=3.13"
dependencies = [
    "shopping-list",
    "dash>=4.0.0",
    "plotly>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shopping-list = { workspace = true }
